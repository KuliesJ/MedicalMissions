{% extends 'template.html' %}

{% block title %}Create Post{% endblock %}

{% block content %}
    <div class="container">
        <h1 class="my-4">Create a New Block</h1>
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <form method="POST" enctype="multipart/form-data" class="card shadow-sm p-4">
                    <div class="mb-3">
                        <label for="section" class="form-label">Add this block to:</label>
                        <select id="section" name="section" class="form-select">
                            <option value="home">Home</option>
                            <option value="goals_and_services">Goals and Services</option>
                            <option value="next_mission">Next Mission</option>
                            <option value="photo_videos">Photo and Videos</option>
                            <option value="contact_us">Contact Us</option>
                            <option value="previous_missions">Previous Missions</option>
                            <option value="terms_and_conditions">Terms and Conditions</option>
                        </select>
                    </div>
                    
                    <div id="title-field" class="content-field mb-3">
                        <label for="title" class="form-label">Title:</label>
                        <input type="text" id="title" name="title" class="form-control">
                    </div>
                    <div id="subtitle-field" class="content-field mb-3">
                        <label for="subtitle" class="form-label">Subtitle:</label>
                        <input type="text" id="subtitle" name="subtitle" class="form-control">
                    </div>
                    <div id="paragraph-field" class="content-field mb-3">
                        <label for="content" class="form-label">Content:</label>
                        <textarea id="content" name="content" class="form-control" rows="6"></textarea>
                    </div>
                    <div id="image-field" class="content-field mb-3">
                        <label for="image" class="form-label">Image:</label>
                        <input type="file" id="image" name="image" class="form-control">
                    </div>
                    
                    
                    
                    <button type="submit" class="btn btn-primary">Publish</button>
                </form>
                
                {% if error %}
                    <p class="error mt-3">{{ error }}</p>
                {% endif %}
            </div>
        </div>
    </div>
    
    <script>
        function showContentField(contentType) {
            document.querySelectorAll('.content-field').forEach(field => field.style.display = 'none');
            if (contentType === 'title') {
                document.getElementById('title-field').style.display = 'block';
            } else if (contentType === 'subtitle') {
                document.getElementById('subtitle-field').style.display = 'block';
            } else if (contentType === 'paragraph') {
                document.getElementById('paragraph-field').style.display = 'block';
            } else if (contentType === 'image') {
                document.getElementById('image-field').style.display = 'block';
            }
        }
    </script>
{% endblock %}
