{% extends 'template.html' %}

{% block content %}
<div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img class="d-block w-100" src="{{ url_for('static', filename='bgPhoto1.jpeg') }}" alt="First slide">
      <div class="carousel-caption">
        <h5>Slide 1</h5>
        <p>Text for slide 1. This is an example of text in front of the image.</p>
      </div>
    </div>
    <div class="carousel-item">
      <img class="d-block w-100" src="{{ url_for('static', filename='bgPhoto2.jpeg') }}" alt="Second slide">
      <div class="carousel-caption">
        <h5>Slide 2</h5>
        <p>Text for slide 2. This is an example of text in front of the image.</p>
      </div>
    </div>
    <div class="carousel-item">
      <img class="d-block w-100" src="{{ url_for('static', filename='bgPhoto3.jpeg') }}" alt="Third slide">
      <div class="carousel-caption">
        <h5>Slide 3</h5>
        <p>Text for slide 3. This is an example of text in front of the image.</p>
      </div>
    </div>
  </div>
</div>

<style>
  #carouselExampleControls {
    width: 100%;
  }

  .carousel-inner img {
    width: 100%;
    height: 94vh; /* Ajusta la altura como desees */
    object-fit: cover; /* Corta las imágenes para ajustarse a la altura y ancho del contenedor */
  }

  .carousel-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: rgba(0, 0, 0, 0.5); /* Fondo semitransparente para mejor legibilidad del texto */
    color: white;
    padding: 20px;
  }
</style>

{% endblock %}
